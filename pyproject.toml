[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-pilot"
version = "0.2.0"
description = "Research agent swarm: a closed-loop research system with difficulty-based model routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  # The SDK's HTTP client (httpx2) fails on brotli-compressed responses with Brotli < 1.2,
  # which some distributions (Anaconda) ship.
  "brotli>=1.2.0",
  "typer>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.0.0",
  "requests>=2.33.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=6.19.0",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  # Security floors for packages that arrive through the dependencies above: older versions have
  # known vulnerabilities (pip-audit), and pip keeps an installed version that satisfies a loose range.
  "starlette>=1.3.1",
  "urllib3>=2.8.0",
  "anyio>=4.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.5",
  "httpx>=0.27",
]

[project.scripts]
research-pilot = "research_pilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_pilot = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# The rules this code is written against. Listing them keeps CI stable when ruff changes its defaults.
select = ["E4", "E7", "E9", "F", "W605"]

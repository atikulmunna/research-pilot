[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-pilot"
version = "0.2.0"
description = "Research agent swarm: a closed-loop research system with difficulty-based model routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  # The SDK's HTTP client (httpx2) fails on brotli-compressed responses with Brotli < 1.2,
  # which some distributions (Anaconda) ship.
  "brotli>=1.2.0",
  "typer>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=5.0.0",
  "pyyaml>=6.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27",
]

[project.scripts]
research-pilot = "research_pilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_pilot = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

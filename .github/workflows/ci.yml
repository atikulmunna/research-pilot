name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Secret hygiene scan
        run: python scripts/scan_secrets.py

      - name: Run tests
        run: pytest -q

      - name: Offline swarm smoke run (mock models, mock literature, simulated experiments)
        env:
          LLM_PROVIDER: mock
          LLM_MODEL: mock
          LITERATURE_PROVIDERS: mock
          EXPERIMENT_EXECUTOR: simulated
          WORKSPACE_DIR: ./ci_projects
        run: |
          research-pilot routing
          research-pilot new "retrieval augmented generation under distribution shift" --run --quiet
          research-pilot status latest --json > status.json
          research-pilot export latest --to html --output ci_projects/manuscript.html
          python - <<'PY'
          import json
          status = json.load(open("status.json", encoding="utf-8"))
          project = status["project"]
          assert project["status"] == "completed", project
          assert all(agent["tasks"] > 0 for agent in status["agents"].values()), status["agents"]
          assert {"lite", "standard", "strong", "coding"} <= set(project["usage"]["by_tier"]), project["usage"]
          print("Swarm smoke run passed:", project["outcome"])
          PY

round: 4
recommendation: reject
summary: 'The manuscript is now candid that it is a protocol paper with pilot results and no frozen pre-registration.
  It states that every hypothesis is at HYPOTHESIS level and every run is inconclusive. It also discloses most deviations,
  including the R004, R005 and R007 code repairs, so RT3-14 is resolved. The decisive problem is unchanged. The
  title question (does LS ever beat tuned L2 plus post-hoc scaling, and in which regimes) is not answered:

  - H1, the only confirmatory hypothesis, is untested.

  - 0 of 3 central claims are SUPPORTED.

  - The primary run (R001) pools self-defined cells with a non-early-stopped MLP.

  - R009, R010 and R012 run on reconstructed generators.

  - No reproducible specification of generators, grids or regimes appears in the paper.


  Known internal contradictions remain unresolved:

  - The sign of the tuned-baseline miscalibration differs across R001, R002 and R003.

  - The de-smoothing results in R001 and R005 point in opposite directions.

  - The R006 MDE cannot be reconciled with the R001 precision.

  - Holm families are undefined.

  - Table 1 defects persist.


  New problems in this round:

  - Two calibration-slope figures for R010 and R012 (about -0.25 vs -0.05 at eps=0.1) are not reconciled.

  - The R011 numerical-gate failures at tau=4 are undisclosed.

  - In R009, 59% of matched-grid eps selections hit the grid edge, which suggests the LS arm is under-tuned.

  - The R009 nested-LS vs tuned eps=0 CI excludes zero, but the paper does not discuss this.

  - The R012 ''calibrated cell'' labels reuse the same 20 replicates that are later tested.

  - The real-data consistency checks are never reported.


  The novelty rating is incremental and the main null is largely predictable, so significance stays low. A top venue
  would reject this as an unexecuted protocol accompanied by inconsistent pilots.'

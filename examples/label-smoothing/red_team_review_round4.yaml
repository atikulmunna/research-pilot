missing_experiments:
- E12/H1 on the real frozen E11 locked grid (including cells C1, C5 and C7), with held-out overconfidence conditioning
  and per-cell Holm and TOST
- Grid-extended re-run of the R009 matched-grid LS arm (59% edge selection)
- 'H5: LS versus early stopping with a single shared early-stopped MLP specification'
- 'H6: prior-directed shrinkage'
- H7(a) leakage permutation test and full Stage-0 gate results (sklearn match, gradient checks)
- Platt/vector scaling and isotonic calibration baselines
- R003 robustness (d=30), the misspecified generator and the sensitivity analyses
- De-smoothing unit test on known P(y|x) and the clip-floor sensitivity analysis
- Real-data evaluation (breast_cancer, iris, wine and additional tabular sets) with Nadeau-Bengio intervals
- 'Cross-seed aggregation: R004 TOST, ceiling and frontier area; power and MDE from seed-level SDs'
unsupported_claims:
- 'C48: described as ''pre-registered'' despite no frozen pre-registration'
- 'C53: ''well inside the -1 pp margin'' without TOST or CI-width rules'
- 'C51: ''strong underconfidence'', without reconciling the Table 10 and Table 12 slope magnitudes'
- 'C54: de-smoothing effect reported despite the contradictory R001 result and a possible bug'
- 'C55: ''favourable'' numerical gate omits the failed tau=4 precision checks'
- 'C49: absence of overconfidence asserted without an equivalence bound, while R003 shows overconfidence'
novelty_concerns:
- Novelty analysis rates the work incremental (moderate) after searching 63 papers
- The targeted literature search for prior LS-on-LR studies is admitted to be undocumented
- The main null follows almost directly from the population solution (1-eps)P+eps/K plus the strength of tuned TS
  [P042]
methodological_concerns:
- Overconfidence conditioning in R012 reuses the same replicates that are tested (double dipping)
- LS eps grid is edge-saturated in R009, so the LS arm is under-tuned
- The MLP protocol differs across runs (no early stopping, 80/20 hold-out, 15% hold-out, 200-epoch cap)
- The sign of the baseline miscalibration flips across R001, R002, R003 and R008, with different reference metrics
  (truth versus accuracy)
- Top-label mean signed error can mask region-specific miscalibration
reproducibility_concerns:
- Generators, grids, fold counts and regime thresholds are not in the paper. Many are self-defined, assumed or reconstructed.
- No frozen config hash
- Aggregator code that produced the CIs and Holm p-values is not included
- R006 effectively ran one invocation, and R007 outputs are mostly NaN
- The R010, R011 and R012 code repairs are undisclosed
likely_reviewer_questions:
- Why should a protocol with no executed confirmatory test, on reconstructed generators, be published now rather
  than after E12 on the frozen grid?
- What are the Holm families behind p=1.0, 0.4858 and 0.0413?
- Why does the eps=0.1 slope drop by about 0.25 in Table 10 but only 0.05 in Table 12?
- Does the observed slope match the R011 population shrinkage factor c(eps)?
- With 59% of eps selections at the grid edge, how do you know LS was adequately tuned?
- How do you explain the tuned baseline being underconfident in R001 but overconfident in R003?
- Is the R001 de-smoothing worsening a bug?
- What are the real-data results?
- What equivalence margin would let a null be read as 'LS does not help'?
- Why are Platt and isotonic calibration excluded when post-hoc scaling is the baseline to beat?

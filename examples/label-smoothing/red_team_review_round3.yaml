missing_experiments:
- 'H1 test: LS vs eps0+TS on cells pre-classified (on held-out data) as having an overconfident tuned baseline,
  e.g. small-n R003 cells, MLP256 cells and constrained-L2 cells.'
- Regime-resolved R001 contrasts per cell (weak L2, small n, high d, near-separable, wide MLP) instead of a pooled
  estimate.
- Downstream aggregation for R002 (10-replicate gate with one-sided t, bootstrap and SO/SC labels), R004 (TOST,
  ceiling and CI-width rules) and R005 (pooled seeds).
- Platt, vector scaling and isotonic calibration baselines, with budget-matched tuning of the eps=0 arm.
- 'R003 robustness: d=30 with n/d in {3, 30}, the misspecified generator, the joint grid, and oracle and Brier-based
  tuning.'
- A consistent MLP protocol (with or without early stopping) across E2 and E5, plus real-data MLPs.
- Real tabular datasets beyond the bundled scikit-learn toy sets, with Nadeau-Bengio-corrected intervals.
- A de-smoothing implementation check and clip-floor sensitivity on cells identical between R001 and R005.
- R006/R007 audits rerun against actual R002 artefacts.
unsupported_claims:
- 'C23: describes the questions as ''pre-registered'' although no frozen pre-registration exists.'
- 'C24: ''overconfidence premise not supported'' relies on absence of evidence. R002''s n=8 and the failing fam1
  check are unexplained, and R003 contradicts it.'
- 'C25: ''no detectable advantage'' conflicts with the R006 MDE of 0.0294, and the Holm family is undefined.'
- 'C26: framed as a mechanistic finding although robustness tests and the misspecified generator were not run.'
- 'C27: ''well inside the margin'' is claimed although TOST was not computed.'
- 'C28: rests on a single-seed, 5-fold bootstrap and contradicts the sign of the R001 de-smoothing result.'
novelty_concerns:
- The novelty analysis rates the work incremental, with moderate confidence, after searching 59 papers.
- That tuned L2 plus temperature scaling leaves little room for LS in well-specified LR is largely predictable,
  because both are shrinkage toward uniform.
- The contribution (C23) is a framing and protocol, but the protocol is not frozen or fully specified, which weakens
  even that contribution.
methodological_concerns:
- Inner-validation variant selection hurts LS (ls_best_variant 0.5001 vs ls_cvts 0.4993), so the primary contrast
  partly reflects selection noise.
- The sign of the tuned eps=0 baseline's miscalibration differs between R001, R002 and R003.
- Pooling LR and MLP cells in the gate can cancel effects.
- No equivalence margin is set for H0.
- Folds are dependent, and the bootstraps are over few folds.
- The firing proxies are undefined and conflict with the signed-error summary.
- The R004 Pareto comparison uses mismatched curve points.
- Engineer-assumed regimes, grids and stand-in cells mean that runs are not mutually comparable.
reproducibility_concerns:
- Generator, cell, grid, fold and threshold specifications are absent, and there is no configuration hash.
- Downstream aggregators are not included, and many reported statistics are uncomputed.
- R002 replicate exclusion (n=8 of 10 seeds) is undocumented.
- 'R006''s seed structure is ambiguous: registry seeds are missing although internal replicates are claimed.'
- R007 metrics are mostly NaN.
- Pre-execution code repairs in R004, R005 and R007 are undisclosed, and timings depend on core count.
likely_reviewer_questions:
- Why should a null on self-defined synthetic cells inform practitioners, when H1 is untested?
- Why does de-smoothing hurt in R001 but help in R005? Is there a bug?
- Why is tuned eps=0 LR underconfident in R001 but overconfident in R003?
- How does an R006 MDE of 0.029 square with an R001 CI half-width of about 0.0016?
- Which replicates were dropped in R002, and why? How were fam1 check failures handled given the STOP rule?
- What exactly are the Holm families in each run?
- What do the 'fires' indicators measure, and why do they equal 1.0 where signed error is null?
- Were LS and eps=0 given equal tuning budgets?
- Why do the E2 and E5 MLP protocols differ (no early stopping vs hold-out early stopping)?
- Where are the generator and cell specifications?

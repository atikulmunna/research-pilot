round: 3
recommendation: reject
summary: "This revision is much more candid than earlier drafts. It drops the 'pre-registered' label in the abstract,
  lists the engineer-declared deviations, retitles the work to cover LR and small MLPs, and labels every run inconclusive.
  The core problems remain, however.\n\n- **Central question untested.** H1, the regime-resolved question of whether
  LS helps where the tuned baseline is overconfident, is not tested. 0 of 3 central claims are SUPPORTED.\n- **Not
  reproducible.** Generators, cells, grids, folds and regime thresholds are absent from the manuscript.\n- **Unexplained
  anomalies.** These now sit across runs, not just within R001:\n  - De-smoothing hurts in R001 (+0.0135 log loss,
  2.88% clipped) but helps in R005 (-0.0106, 21.9% clipped).\n  - Tuned eps=0 LR is underconfident against truth
  in R001 (-0.0069) but overconfident in R003 (+0.0159, CI excluding 0).\n  - The R006 log-loss MDE (0.0294) is
  roughly 10x the half-width of the R001 CI.\n- **Unfixed reporting and statistics defects.** Table 1's ablation
  rows are identical across all arms. The R002 analysis has n=8 instead of 10 and a failing fam1 check whose handling
  is undocumented. The Holm families are undefined. Inferential statistics that were deferred to downstream code
  (TOST, gate aggregation, seed pooling) are missing.\n- **Limited significance.** The work is rated incremental,
  its primary null is largely predictable, and the only clear positive effect (constrained L2 is overconfident)
  holds by construction.\n\nAs a protocol paper it lacks the frozen specification a protocol needs. As an empirical
  paper it does not answer its title question."
issues:
- id: RT3-1
  severity: critical
  dimension: experiments
  description: The title and Q-a ask in which regimes LS helps beyond tuned L2 and TS. Yet H1 is explicitly untested,
    and no regime is shown where the tuned baseline is overconfident. The primary run (R001) pools self-defined
    synthetic cells. The Q-c Pareto comparison in R004 compares different curve points and, by the authors' own
    statement, does not settle Q-c. 0 of 3 central claims are SUPPORTED. This is the continuation of RT2-1.
  affected_claims:
  - C23
  - C24
  - C25
  - C29
  required_action: experiment
  suggestion: Run the H1 test on cells where the tuned eps=0 baseline is pre-classified as overconfident, using
    held-out data for that classification. Constrained-L2 cells C1/C5/C7/D1, MLP256 cells, or R003's small-n cells
    are candidates. Then report regime-resolved LS vs eps0+TS contrasts.
  status: open
  round: 3
- id: RT3-2
  severity: major
  dimension: reproducibility
  description: The manuscript states that the full specification of generators, cells, grids, folds and regime thresholds
    'is not available in the evidence supplied'. No frozen configuration hash exists. Several grids (G9/G9') and
    regimes (R1-R5) were engineer-assumed, and stand-in cells were used in R006 and R007. No run can be reproduced
    from the paper. This continues RT1-3 and RT2-3.
  affected_claims:
  - C23
  - C24
  - C25
  - C26
  - C27
  - C28
  required_action: revision
  suggestion: 'Add a specification table covering every cell: d, n, class count, link, separability, eps/C/weight-decay/TS
    grids, MLP width, optimiser and epochs, fold counts, bootstrap resamples and regime thresholds. Freeze it with
    a hash and release the code.'
  status: open
  round: 3
- id: RT3-3
  severity: major
  dimension: experiments
  description: The de-smoothing results contradict each other across runs. In R001, ls_desmooth is worse than ls_raw
    (+0.0135 log loss, CI [0.0100, 0.0169], 2.88% clipped). In R005 it is better (-0.0106, CI [-0.0170, -0.0041],
    21.9% clipped). The authors flag the R001 result as an unexplained anomaly and have not excluded a clipping
    or implementation bug. Together the two runs suggest an implementation-dependent or regime-dependent artefact
    rather than a finding.
  affected_claims:
  - C28
  - C25
  required_action: analysis
  suggestion: Unit-test the de-smoothing inverse against analytic cases. Report clip rates and log loss by clip
    floor using the R005 clip-floor outputs already stored in e3_details.json. Run both experiments on identical
    cells, so a regime difference can be separated from a bug.
  status: open
  round: 3
- id: RT3-4
  severity: major
  dimension: methodology
  description: 'The sign of the tuned eps=0 baseline''s miscalibration is inconsistent across runs.

    - R001: best-tuned eps=0 is underconfident against truth (-0.0069, CI excluding 0).

    - R002: the pooled gate is null (-0.0027).

    - R003: eps0_best_lr is overconfident against truth (+0.0159, CI [0.0064, 0.0254]).

    The R003 result is the H1 precondition, yet the paper says H1 is untested and H0 is not contradicted. In R003,
    LS reduces pooled signed error to +0.0023 and has negative MSE point estimates at n30 and n100. That is directly
    relevant to H1 but is not discussed as such.'
  affected_claims:
  - C24
  - C26
  - C29
  required_action: analysis
  suggestion: Reconcile H0 across R001, R002 and R003 using a common signed-error definition. Report per-cell signed
    error for eps0_best_lr in R003. Discuss whether the small-n R003 cells constitute an overconfident regime, with
    a pre-specified, held-out classification.
  status: open
  round: 3
- id: RT3-5
  severity: major
  dimension: statistics
  description: The precision claims are internally inconsistent. R006 reports a log-loss MDE of 0.0294 for best-tuned
    LS at 20 replicates, roughly 3x the 0.01 margin. R001, also at 20 seeds, reports a paired CI of half-width about
    0.0016. Either the configurations differ greatly, R006 being a single stand-in configuration, or one computation
    is wrong. If the MDE is correct, the R001 null and the 'no detectable advantage' claim are uninformative.
  affected_claims:
  - C25
  required_action: analysis
  suggestion: Compute the MDE on the actual R001 cells from the observed paired SD. State which configuration each
    power number applies to. Justify the 0.01 margin relative to effect sizes that matter in practice.
  status: open
  round: 3
- id: RT3-6
  severity: major
  dimension: statistics
  description: 'The R002 integrity problems remain unexplained (continuation of RT2-4):

    - n=8 per cell although 10 seeds were run.

    - fam1_check_pass has mean 0.8, yet the declared STOP rule says the script exits on failure, and the handling
    of failing replicates is undocumented. This looks like possible post-hoc exclusion.

    - The D1 versus three-cell summary discrepancy is acknowledged but not resolved.

    - The ''fires'' indicators equal 1.0 for C1/C5/C7 and most MLP256 cells under tuned L2, contradicting the signed-error
    summary. They remain undefined.'
  affected_claims:
  - C24
  required_action: analysis
  suggestion: Publish per-seed R002 outputs and a replicate-inclusion log. Define the firing proxies (a-d). Rerun
